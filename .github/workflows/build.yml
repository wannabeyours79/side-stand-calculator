name: Build Side Stand Calculator APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Create Android project
        run: |
          mkdir -p app/src/main/java/com/sidestand/calculator

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "SideStandCalculator"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.sidestand.calculator'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.sidestand.calculator'
                  minSdk 23
                  targetSdk 28
                  versionCode 3
                  versionName '1.2'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:label="Side Stand Studio"
                  android:usesCleartextTraffic="false">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/sidestand/calculator/MainActivity.java <<'EOF'
          package com.sidestand.calculator;

          import android.app.Activity;
          import android.os.Bundle;
          import android.content.Context;
          import android.content.Intent;
          import android.webkit.WebView;
          import android.webkit.WebSettings;
          import android.webkit.JavascriptInterface;
          import android.print.PrintManager;
          import android.print.PrintDocumentAdapter;
          import android.graphics.Color;

          public class MainActivity extends Activity {

              private WebView web;
              private boolean printPending = false;

              @Override
              public void onCreate(Bundle state) {
                  super.onCreate(state);

                  getWindow().setStatusBarColor(Color.rgb(12, 12, 12));
                  getWindow().setNavigationBarColor(Color.rgb(12, 12, 12));

                  web = new WebView(this);

                  WebSettings settings = web.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);

                  web.addJavascriptInterface(this, "Android");

                  setContentView(web);

                  web.loadDataWithBaseURL(
                      null,
                      html(),
                      "text/html",
                      "UTF-8",
                      null
                  );
              }

              @JavascriptInterface
              public void printNota() {
                  runOnUiThread(() -> {
                      PrintManager manager =
                          (PrintManager) getSystemService(Context.PRINT_SERVICE);

                      if (manager != null && web != null) {
                          printPending = true;
                          PrintDocumentAdapter adapter =
                              web.createPrintDocumentAdapter("Nota-Side-Stand");

                          manager.print(
                              "Nota Side Stand Studio",
                              adapter,
                              new android.print.PrintAttributes.Builder()
                                  .setMediaSize(
                                      android.print.PrintAttributes.MediaSize.ISO_A4
                                  )
                                  .setColorMode(
                                      android.print.PrintAttributes.COLOR_MODE_COLOR
                                  )
                                  .build()
                          );
                      }
                  });
              }

              @JavascriptInterface
              public void shareText(String text) {
                  runOnUiThread(() -> {
                      Intent send = new Intent(Intent.ACTION_SEND);
                      send.setType("text/plain");
                      send.putExtra(Intent.EXTRA_TEXT, text == null ? "" : text);
                      startActivity(Intent.createChooser(send, "Bagikan nota"));
                  });
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  if (printPending && web != null) {
                      printPending = false;
                      web.postDelayed(() -> web.evaluateJavascript(
                          "if(window.onPrintDialogClosed){window.onPrintDialogClosed();}", null
                      ), 700);
                  }
              }

              private String html() {
                  return """
          <!DOCTYPE html>
          <html lang="id">
          <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">

          <title>Side Stand Studio</title>

          <style>
          * {
              box-sizing: border-box;
          }

          body {
              margin: 0;
              padding: 18px;
              background: #101010;
              color: white;
              font-family: Arial, sans-serif;
          }

          .brand {
              text-align: center;
              font-size: 12px;
              letter-spacing: 5px;
              color: #aaa;
              margin: 15px 0;
          }

          h1 {
              text-align: center;
              font-size: 25px;
              margin: 8px 0;
          }

          .sub {
              text-align: center;
              color: #aaa;
              font-size: 11px;
              margin-bottom: 22px;
          }

          .tabs {
              display: flex;
              gap: 10px;
              margin-bottom: 15px;
          }

          .tab {
              flex: 1;
              padding: 13px;
              background: #242424;
              color: white;
              border: 1px solid #444;
              border-radius: 10px;
              font-weight: bold;
          }

          .tab.active {
              background: white;
              color: #111;
          }

          .box {
              background: #1c1c1c;
              border: 1px solid #383838;
              border-radius: 14px;
              padding: 15px;
              margin-bottom: 14px;
          }

          label {
              display: block;
              font-size: 13px;
              color: #ccc;
              margin: 13px 0 7px;
          }

          select,
          input:not([type=checkbox]) {
              width: 100%;
              padding: 12px;
              border-radius: 9px;
              border: 1px solid #444;
              background: #111;
              color: white;
              font-size: 15px;
          }

          .check {
              display: flex;
              align-items: center;
              gap: 10px;
              margin: 14px 0;
              font-size: 14px;
          }

          .check input {
              width: 19px;
              height: 19px;
              accent-color: white;
          }

          button.action {
              width: 100%;
              border: 0;
              border-radius: 9px;
              padding: 13px;
              margin-top: 10px;
              font-weight: bold;
              font-size: 14px;
          }

          .white {
              background: white;
              color: #111;
          }

          .dark {
              background: #333;
              color: white;
          }

          .red {
              background: #552525;
              color: white;
          }

          .hidden {
              display: none !important;
          }

          .note {
              font-size: 11px;
              text-align: center;
              color: #999;
              margin: 15px 0;
          }

          .cart-item {
              border: 1px solid #414141;
              border-radius: 10px;
              padding: 12px;
              margin-top: 10px;
              background: #151515;
          }

          .cart-title {
              font-weight: bold;
              margin-bottom: 5px;
          }

          .cart-meta {
              font-size: 12px;
              line-height: 1.8;
              color: #ccc;
              overflow-wrap: anywhere;
          }

          .cart-price {
              font-weight: bold;
              margin-top: 8px;
          }

          .cart-actions {
              display: flex;
              gap: 8px;
          }

          .cart-actions button {
              flex: 1;
              border: 0;
              border-radius: 8px;
              padding: 10px;
              margin-top: 10px;
              font-weight: bold;
          }

          .edit {
              background: #ddd;
              color: #111;
          }

          .delete {
              background: #552525;
              color: white;
          }

          .total {
              background: white;
              color: #111;
              padding: 18px;
              border-radius: 13px;
              text-align: center;
          }

          .price {
              font-size: 28px;
              font-weight: bold;
              margin: 8px 0;
          }

          .detail {
              font-size: 13px;
              line-height: 1.8;
              color: #ddd;
              margin-top: 10px;
              overflow-wrap: anywhere;
          }

          .empty {
              font-size: 13px;
              color: #999;
              text-align: center;
              padding: 18px 5px;
          }

          .print-only { display: none; }
          .invoice-head { text-align:center; padding: 10px 0 18px; border-bottom:2px solid #111; }
          .invoice-logo { display:block; width:100%; max-height:90px; object-fit:contain; margin:0 auto 10px; }
          .invoice-brand { font-size:25px; letter-spacing:8px; font-weight:800; }
          .invoice-tag { font-size:10px; letter-spacing:5px; margin-top:7px; }
          .invoice-title-row { display:flex; justify-content:space-between; gap:20px; margin:22px 0 18px; align-items:end; }
          .invoice-title { font-size:27px; font-weight:800; }
          .invoice-slogan { text-align:right; font-size:10px; letter-spacing:4px; line-height:1.8; }
          .invoice-meta { display:grid; grid-template-columns:1fr 1fr; gap:8px 24px; margin:16px 0 22px; font-size:12px; }
          .invoice-table { width:100%; border-collapse:collapse; font-size:11px; }
          .invoice-table th { background:#111; color:#fff; padding:10px 7px; text-align:left; }
          .invoice-table td { padding:12px 7px; border-bottom:1px solid #aaa; vertical-align:top; }
          .invoice-table .num, .invoice-table .money { text-align:right; white-space:nowrap; }
          .invoice-total-row { display:flex; justify-content:space-between; align-items:center; gap:15px; margin:20px 0; padding:16px 0; border-bottom:2px solid #111; }
          .invoice-total-label { font-size:12px; font-weight:bold; }
          .invoice-total-amount { font-size:30px; font-weight:900; }
          .invoice-bottom { display:grid; grid-template-columns:1fr 1fr; gap:20px; background:#f1f1f1; padding:16px; border-radius:8px; font-size:11px; }
          .invoice-bottom h3 { margin:0 0 10px; font-size:12px; }
          .invoice-footer { display:flex; justify-content:space-between; gap:10px; border-top:1px solid #111; padding-top:14px; margin-top:22px; font-size:10px; letter-spacing:2px; }
          @media print {
              @page { size: A4; margin: 14mm; }
              body {
                  background: white;
                  color: #111;
                  padding: 0;
              }

              .brand,
              .sub {
                  color: #333;
              }

              .tabs,
              .no-print,
              .note,
              .form-box,
              body > .brand,
              body > h1,
              body > .sub,
              body > .box,
              body > .total {
                  display: none !important;
              }
              .print-only { display: block !important; color:#111; background:#fff; }
              .invoice-table { page-break-inside:auto; }
              .invoice-table tr { page-break-inside:avoid; page-break-after:auto; }

              .box {
                  background: white;
                  color: #111;
                  border: 1px solid #bbb;
              }

              .cart-item {
                  background: white;
                  color: #111;
                  border: 1px solid #bbb;
                  break-inside: avoid;
              }

              .cart-meta {
                  color: #222;
              }

              .cart-actions {
                  display: none !important;
              }

              .total {
                  border: 1px solid #999;
                  margin-top: 12px;
              }

              .detail {
                  color: #111;
              }
          }
          </style>
          </head>

          <body>

          <div class="brand">SIDE STAND STUDIO</div>

          <h1>PRICE CALCULATOR</h1>

          <div class="sub">CLOTHING ORDER ESTIMATOR</div>

          <section class="print-only" id="printInvoice">
              <div class="invoice-head">
                  <div class="invoice-brand">SIDE STAND STUDIO</div>
                  <div class="invoice-tag">STREETWEAR &amp; CLOTHING</div>
              </div>
              <div class="invoice-title-row">
                  <div class="invoice-title">NOTA PESANAN</div>
                  <div class="invoice-slogan">BETTER CLOTHES<br>BETTER DAYS</div>
              </div>
              <div class="invoice-meta">
                  <div>No. Nota: <b id="invoiceNumber">#SSS-0001</b></div>
                  <div>Tanggal: <b id="invoiceDate">-</b></div>
                  <div>Nama: <b id="customerNamePrint">-</b></div>
                  <div>No. WhatsApp: <b id="customerPhonePrint">-</b></div>
              </div>
              <table class="invoice-table">
                  <thead><tr><th>No.</th><th>Produk</th><th>Bahan</th><th>Ukuran</th><th>Qty</th><th>Harga/pcs</th><th>Subtotal</th></tr></thead>
                  <tbody id="invoiceRows"></tbody>
              </table>
              <div class="invoice-total-row">
                  <div><div class="invoice-total-label">TOTAL ITEM</div><div id="invoiceItemCount">0 item · 0 pcs</div></div>
                  <div><div class="invoice-total-label">TOTAL PEMBAYARAN</div><div class="invoice-total-amount" id="invoiceTotal">Rp0</div></div>
              </div>
              <div class="invoice-bottom">
                  <div><h3>RINCIAN TAMBAHAN</h3><div id="invoiceExtras">Belum ada tambahan.</div></div>
                  <div><h3>CATATAN</h3>• Pastikan ukuran dan jumlah sudah sesuai sebelum proses produksi.<br>• Harga mengikuti bahan dan desain yang dipilih.<br>• Terima kasih telah mempercayai Side Stand Studio.</div>
              </div>
              <div class="invoice-footer"><span>@sidestandstudio</span><span>SIDE STAND STUDIO<br>THANKS FOR YOUR SUPPORT</span><span>LOCAL BRAND</span></div>
          </section>

          <div class="tabs no-print">
              <button class="tab active" id="tabOblong"
                  onclick="setProduct('oblong')">OBLONG</button>

              <button class="tab" id="tabJersey"
                  onclick="setProduct('jersey')">JERSEY</button>
          </div>

          <div class="box form-box">

              <b id="formHeading">Tambah produk ke keranjang</b>

              <label>Jenis bahan</label>
              <select id="fabric"></select>

              <label>Ukuran</label>

              <select id="size">
                  <option value="0">S</option>
                  <option value="0">M</option>
                  <option value="0">L</option>
                  <option value="0">XL</option>
                  <option value="5000">XXL (+Rp5.000)</option>
                  <option value="10000">XXXL (+Rp10.000)</option>
                  <option value="15000">XXXXL (+Rp15.000)</option>
                  <option value="20000">XXXXXL (+Rp20.000)</option>
              </select>

              <div id="oblongOptions">
                  <div class="check">
                      <input type="checkbox" id="long">
                      <span>Lengan panjang (+Rp10.000)</span>
                  </div>

                  <div class="check">
                      <input type="checkbox" id="rib">
                      <span>Tambah rib (+Rp5.000)</span>
                  </div>
              </div>

              <div id="jerseyOptions" class="hidden">
                  <div class="check">
                      <input type="checkbox" id="collar">
                      <span>Tambah kerah (+Rp5.000)</span>
                  </div>
              </div>

              <label>Panjang sablon ke samping (cm)</label>
              <input id="printWidth" type="number" min="0" step="1" value="0">

              <div class="note">
                  Biaya sablon Rp1.000 per cm ke samping.
              </div>

              <label>Jumlah untuk ukuran ini</label>
              <input id="qty" type="number" min="1" step="1" value="1">

              <button class="action white" id="addButton"
                  onclick="addOrUpdateCart()">
                  TAMBAHKAN KE KERANJANG
              </button>

              <button class="action dark hidden" id="cancelEditButton"
                  onclick="cancelEdit()">
                  BATAL EDIT
              </button>
          </div>

          <div class="box">
              <b>Keranjang pesanan</b>

              <div class="cart-meta">
                  Masukkan tiap ukuran sebagai item terpisah.
                  Contoh: M 3 pcs, L 2 pcs, XL 1 pcs.
              </div>

              <div id="cartList">
                  <div class="empty">Keranjang masih kosong.</div>
              </div>
          </div>

          <div class="total">
                     <small>TOTAL SELURUH PESANAN</small>
              <div class="price" id="total">Rp0</div>
              <div id="itemCount">0 item · 0 pcs</div>
          </div>

          <div class="box" style="margin-top:14px">
              <b>Rincian nota</b>
              <label>Nama pelanggan (opsional)</label>
              <input id="customerName" type="text" placeholder="Nama pelanggan">
              <label>Nomor WhatsApp (opsional)</label>
              <input id="customerPhone" type="tel" placeholder="08xxxxxxxxxx">

              <div class="detail" id="details">
                  Tambahkan produk ke keranjang untuk membuat nota.
              </div>

              <div class="no-print">
                  <button class="action white" onclick="printNota()">
                      CETAK NOTA / SIMPAN PDF
                  </button>

                  <button class="action dark" onclick="share()">
                      BAGIKAN RINCIAN
                  </button>

                  <button class="action red" onclick="clearCart()">
                      KOSONGKAN KERANJANG
                  </button>
              </div>
          </div>

          <div class="note">
              SIDE STAND STUDIO · THANKS FOR YOUR SUPPORT
          </div>

          <script>
          let product = 'oblong';
          let cart = [];
          let editIndex = -1;

          const fabrics = {
              oblong: [
                  {name: 'Combed 30s', price: 35000},
                  {name: 'Combed 24s', price: 40000}
              ],
              jersey: [
                  {name: 'Milano', price: 85000},
                  {name: 'Jarum', price: 85000},
                  {name: 'Embos', price: 90000},
                  {name: 'Puma', price: 90000}
              ]
          };

          const rupiah = n =>
              'Rp' + Math.round(n).toLocaleString('id-ID');

          const el = id => document.getElementById(id);

          function escapeHtml(value) {
              return String(value).replace(/[&<>"']/g, function(c) {
                  return {
                      '&': '&amp;',
                      '<': '&lt;',
                      '>': '&gt;',
                      '"': '&quot;',
                      "'": '&#39;'
                  }[c];
              });
          }

          function currentInvoiceNumber() {
              const next = Math.max(1, Number(localStorage.getItem('sssNextInvoice') || '1'));
              return '#SSS-' + String(next).padStart(4, '0');
          }

          function updateInvoiceNumber() {
              const node = el('invoiceNumber');
              if (node) node.textContent = currentInvoiceNumber();
          }

          function finishCurrentOrder() {
              if (cart.length === 0) return;
              if (!confirm('Sudah selesai mencetak atau menyimpan nota? Jika ya, keranjang dikosongkan dan nomor nota berikutnya dibuat.')) {
                  return;
              }
              const next = Math.max(1, Number(localStorage.getItem('sssNextInvoice') || '1'));
              localStorage.setItem('sssNextInvoice', String(next + 1));
              cart = [];
              editIndex = -1;
              el('customerName').value = '';
              el('customerPhone').value = '';
              el('customerNamePrint').textContent = '-';
              el('customerPhonePrint').textContent = '-';
              el('formHeading').textContent = 'Tambah produk ke keranjang';
              el('addButton').textContent = 'TAMBAHKAN KE KERANJANG';
              el('cancelEditButton').classList.add('hidden');
              resetForm();
              renderCart();
              updateInvoiceNumber();
              alert('Pesanan selesai. Nomor nota berikutnya: ' + currentInvoiceNumber());
          }

          window.onPrintDialogClosed = function() {
              if (cart.length > 0) finishCurrentOrder();
          };

          window.addEventListener('afterprint', function() {
              if (!(window.Android && window.Android.printNota) && cart.length > 0) {
                  finishCurrentOrder();
              }
          });

          function setProduct(p) {
              product = p;

              el('tabOblong').classList.toggle(
                  'active', p === 'oblong'
              );

              el('tabJersey').classList.toggle(
                  'active', p === 'jersey'
              );

              el('oblongOptions').classList.toggle(
                  'hidden', p !== 'oblong'
              );

              el('jerseyOptions').classList.toggle(
                  'hidden', p !== 'jersey'
              );

              const fabric = el('fabric');
              fabric.innerHTML = '';

              fabrics[p].forEach(f => {
                  const option = document.createElement('option');

                  option.value = f.price;
                  option.textContent = f.name + ' - ' + rupiah(f.price);
                  option.dataset.name = f.name;

                  fabric.appendChild(option);
              });

              renderCart();
          }

          function getFormItem() {
              const fabricOption = el('fabric').selectedOptions[0];
              const sizeOption = el('size').selectedOptions[0];

              const base = Number(el('fabric').value) || 0;
              const sizeCost = Number(el('size').value) || 0;

              const longCost =
                  product === 'oblong' && el('long').checked
                  ? 10000 : 0;

              const ribCost =
                  product === 'oblong' && el('rib').checked
                  ? 5000 : 0;

              const collarCost =
                  product === 'jersey' && el('collar').checked
                  ? 5000 : 0;

              const width = Math.max(
                  0, Number(el('printWidth').value) || 0
              );

              const qty = Math.max(
                  1, Math.floor(Number(el('qty').value) || 1)
              );

              const printCost = width * 1000;

              const each =
                  base + sizeCost + longCost +
                  ribCost + collarCost + printCost;

              return {
                  product: product,
                  fabricName: fabricOption
                      ? fabricOption.dataset.name : '-',
                  base: base,
                  sizeName: sizeOption
                      ? sizeOption.textContent : '-',
                  sizeCost: sizeCost,
                  longCost: longCost,
                  ribCost: ribCost,
                  collarCost: collarCost,
                  width: width,
                  printCost: printCost,
                  qty: qty,
                  each: each,
                  subtotal: each * qty
              };
          }

          function addOrUpdateCart() {
              const item = getFormItem();

              if (editIndex >= 0) {
                  cart[editIndex] = item;
                  editIndex = -1;

                  el('formHeading').textContent =
                      'Tambah produk ke keranjang';

                  el('addButton').textContent =
                      'TAMBAHKAN KE KERANJANG';

                  el('cancelEditButton').classList.add('hidden');

                  alert('Item keranjang berhasil diperbarui.');
              } else {
                  cart.push(item);
              }

              renderCart();
              resetForm();
          }

          function editCartItem(index) {
              const item = cart[index];

              editIndex = index;

              setProduct(item.product);

              el('fabric').value = String(item.base);
              el('size').value = String(item.sizeCost);

              el('long').checked = item.longCost > 0;
              el('rib').checked = item.ribCost > 0;
              el('collar').checked = item.collarCost > 0;

              el('printWidth').value = String(item.width);
              el('qty').value = String(item.qty);

              el('formHeading').textContent = 'Edit item keranjang';
              el('addButton').textContent = 'SIMPAN PERUBAHAN';

              el('cancelEditButton').classList.remove('hidden');

              window.scrollTo({top: 0, behavior: 'smooth'});
          }

          function deleteCartItem(index) {
              cart.splice(index, 1);

              if (editIndex === index) {
                  cancelEdit();
              } else if (editIndex > index) {
                  editIndex--;
              }

              renderCart();
          }

          function cancelEdit() {
              editIndex = -1;

              el('formHeading').textContent =
                  'Tambah produk ke keranjang';

              el('addButton').textContent =
                  'TAMBAHKAN KE KERANJANG';

              el('cancelEditButton').classList.add('hidden');

              resetForm();
          }

          function resetForm() {
              el('size').value = '0';

              el('long').checked = false;
              el('rib').checked = false;
              el('collar').checked = false;

              el('printWidth').value = '0';
              el('qty').value = '1';
          }

          function renderCart() {
              const list = el('cartList');

              if (cart.length === 0) {
                  list.innerHTML =
                      '<div class="empty">Keranjang masih kosong.</div>';
              } else {
                  list.innerHTML = cart.map((item, i) => {
                      const options = [];

                      if (item.longCost) {
                          options.push('Lengan panjang');
                      }

                      if (item.ribCost) {
                          options.push('Rib');
                      }

                      if (item.collarCost) {
                          options.push('Kerah');
                      }

                      if (item.width > 0) {
                          options.push('Sablon ' + item.width + ' cm');
                      }

                      return `
                      <div class="cart-item">
                          <div class="cart-title">
                              ${i + 1}. ${escapeHtml(item.product.toUpperCase())}
                              · Ukuran ${escapeHtml(item.sizeName.split(' ')[0])}
                          </div>

                          <div class="cart-meta">
                              Bahan: ${escapeHtml(item.fabricName)}
                              <br>Jumlah: ${item.qty} pcs
                              <br>Tambahan: ${escapeHtml(
                                  options.length ? options.join(', ') : 'Tidak ada'
                              )}
                              <br>Harga per pcs: ${rupiah(item.each)}
                          </div>

                          <div class="cart-price">
                              Subtotal: ${rupiah(item.subtotal)}
                          </div>

                          <div class="cart-actions no-print">
                              <button class="edit"
                                  onclick="editCartItem(${i})">EDIT</button>

                              <button class="delete"
                                  onclick="deleteCartItem(${i})">HAPUS</button>
                          </div>
                      </div>`;
                  }).join('');
              }
              const total = cart.reduce(
                  (sum, item) => sum + item.subtotal, 0
              );

              const pcs = cart.reduce(
                  (sum, item) => sum + item.qty, 0
              );

              el('total').textContent = rupiah(total);

              el('itemCount').textContent =
                  cart.length + ' item · ' + pcs + ' pcs';

              if (cart.length === 0) {
                  el('details').textContent =
                      'Tambahkan produk ke keranjang untuk membuat nota.';
                  el('invoiceRows').innerHTML = '';
                  el('invoiceTotal').textContent = rupiah(0);
                  el('invoiceItemCount').textContent = '0 item · 0 pcs';
                  el('invoiceExtras').textContent = 'Belum ada tambahan.';
                  return;
              }

              const invoiceRows = cart.map((item, i) => {
                  const options = [];
                  if (item.longCost) options.push('Lengan panjang');
                  if (item.ribCost) options.push('Rib');
                  if (item.collarCost) options.push('Kerah');
                  if (item.width > 0) options.push('Sablon ' + item.width + ' cm');
                  const sizeName = item.sizeName.split(' ')[0];
                  return `<tr>
                    <td>${i + 1}</td>
                    <td><b>${escapeHtml(item.product.toUpperCase())}</b><br><small>${escapeHtml(options.join(', ') || 'Tanpa tambahan')}</small></td>
                    <td>${escapeHtml(item.fabricName)}</td>
                    <td>${escapeHtml(sizeName)}</td>
                    <td>${item.qty}</td>
                    <td class="money">${rupiah(item.each)}</td>
                    <td class="money">${rupiah(item.subtotal)}</td>
                  </tr>`;
              }).join('');
              el('invoiceRows').innerHTML = invoiceRows;
              el('invoiceTotal').textContent = rupiah(total);
              el('invoiceItemCount').textContent = cart.length + ' item · ' + pcs + ' pcs';
              el('invoiceDate').textContent = new Date().toLocaleString('id-ID', {day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit'});
              el('customerNamePrint').textContent = el('customerName').value.trim() || '-';
              el('customerPhonePrint').textContent = el('customerPhone').value.trim() || '-';
              const extras = [];
              cart.forEach(item => {
                  if (item.printCost) extras.push('Sablon ' + item.width + ' cm — ' + rupiah(item.printCost) + ' / pcs');
                  if (item.longCost) extras.push('Lengan panjang — ' + rupiah(item.longCost));
                  if (item.collarCost) extras.push('Kerah — ' + rupiah(item.collarCost));
                  if (item.ribCost) extras.push('Rib — ' + rupiah(item.ribCost));
              });
              el('invoiceExtras').innerHTML = extras.length ? [...new Set(extras)].map(escapeHtml).join('<br>') : 'Tidak ada biaya tambahan.';

              const lines = [
                  'NOTA SIDE STAND STUDIO',
                  '========================',
                  ''
              ];

              cart.forEach((item, i) => {
                  lines.push(
                      (i + 1) + '. ' +
                      item.product.toUpperCase() + ' / ' +
                      item.fabricName
                  );

                  lines.push(
                      '   Ukuran: ' + item.sizeName +
                      ' | Jumlah: ' + item.qty + ' pcs'
                  );

                  if (item.longCost) {
                      lines.push('   Lengan panjang: ' + rupiah(item.longCost));
                  }

                  if (item.ribCost) {
                      lines.push('   Rib: ' + rupiah(item.ribCost));
                  }

                  if (item.collarCost) {
                      lines.push('   Kerah: ' + rupiah(item.collarCost));
                  }

                  if (item.width > 0) {
                      lines.push(
                          '   Sablon ' + item.width + ' cm: ' +
                          rupiah(item.printCost)
                      );
                  }

                  lines.push('   Harga/pcs: ' + rupiah(item.each));
                  lines.push('   Subtotal: ' + rupiah(item.subtotal));
                  lines.push('');
              });

              lines.push('Jumlah item: ' + cart.length);
              lines.push('Jumlah pcs: ' + pcs);
              lines.push('TOTAL: ' + rupiah(total));

              el('details').innerHTML = lines
                  .map(line => escapeHtml(line))
                  .join('<br>');
          }

          function printNota() {
              if (cart.length === 0) {
                  alert('Keranjang masih kosong!');
                  return;
              }
              updateInvoiceNumber();
              if (window.Android && window.Android.printNota) {
                  window.Android.printNota();
              } else {
                  window.print();
              }
          }

          function share() {
              if (cart.length === 0) {
                  alert('Keranjang masih kosong!');
                  return;
              }
              const customer = el('customerName').value.trim();
              const phone = el('customerPhone').value.trim();
              const text = [
                  'SIDE STAND STUDIO',
                  'NOTA PESANAN ' + currentInvoiceNumber(),
                  'Tanggal: ' + new Date().toLocaleString('id-ID'),
                  customer ? 'Nama pelanggan: ' + customer : '',
                  phone ? 'WhatsApp: ' + phone : '',
                  '',
                  el('details').innerText,
                  '',
                  'TOTAL PEMBAYARAN: ' + el('total').innerText,
                  '',
                  'Terima kasih sudah mempercayai Side Stand Studio!'
              ].filter(Boolean).join('\n');
              if (window.Android && window.Android.shareText) {
                  window.Android.shareText(text);
              } else if (navigator.share) {
                  navigator.share({title: 'Nota Side Stand Studio', text: text}).catch(() => {});
              } else if (navigator.clipboard && navigator.clipboard.writeText) {
                  navigator.clipboard.writeText(text)
                      .then(() => alert('Nota disalin. Lu bisa tempel ke WhatsApp.'))
                      .catch(() => alert(text));
              } else {
                  alert(text);
              }
          }

          function clearCart() {
              if (cart.length === 0) {
                  alert('Keranjang sudah kosong.');
                  return;
              }
              if (!confirm('Yakin ingin menghapus semua isi keranjang?')) return;
              cart = [];
              editIndex = -1;
              el('customerName').value = '';
              el('customerPhone').value = '';
              el('customerNamePrint').textContent = '-';
              el('customerPhonePrint').textContent = '-';
              el('formHeading').textContent = 'Tambah produk ke keranjang';
              el('addButton').textContent = 'TAMBAHKAN KE KERANJANG';
              el('cancelEditButton').classList.add('hidden');
              resetForm();
              renderCart();
              alert('Keranjang berhasil dikosongkan. Nomor nota tidak berubah.');
          }

          el('customerName').addEventListener('input', () => {
              el('customerNamePrint').textContent = el('customerName').value.trim() || '-';
          });
          el('customerPhone').addEventListener('input', () => {
              el('customerPhonePrint').textContent = el('customerPhone').value.trim() || '-';
          });

          updateInvoiceNumber();
          setProduct('oblong');
          renderCart();
          </script>

          </body>
          </html>
          """;
              }
          }
          EOF

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Side-Stand-Calculator-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
