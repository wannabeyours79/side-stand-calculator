name: Build Side Stand Calculator APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager --licenses
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Create Android project
        run: |
          mkdir -p app/src/main/java/com/sidestand/calculator

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "SideStandCalculator"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
             namespace 'com.sidestand.calculator'
             compileSdk 35

             defaultConfig {
               applicationId 'com.sidestand.calculator'
               minSdk 23
               targetSdk 28
               versionCode 1
               versionName '1.0'
          }
  
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
          }
          }
          EOF


          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:label="Side Stand Studio"
                  android:usesCleartextTraffic="false">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/sidestand/calculator/MainActivity.java <<'EOF'
          package com.sidestand.calculator;

          import android.app.Activity;
          import android.os.Bundle;
          import android.content.Context;
          import android.webkit.WebView;
          import android.webkit.WebSettings;
          import android.webkit.JavascriptInterface;
          import android.print.PrintManager;
          import android.print.PrintDocumentAdapter;
          import android.graphics.Color;
          import android.view.ViewGroup;
          import android.view.Window;
          import android.view.WindowManager;

          public class MainActivity extends Activity {
              private WebView web;

              @Override
              public void onCreate(Bundle state) {
                  super.onCreate(state);

                  getWindow().setStatusBarColor(Color.rgb(12, 12, 12));
                  getWindow().setNavigationBarColor(Color.rgb(12, 12, 12));

                  web = new WebView(this);
                  WebSettings settings = web.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);

                  web.addJavascriptInterface(this, "Android");
                  setContentView(web);

                  web.loadDataWithBaseURL(
                      null, html(), "text/html", "UTF-8", null
                  );
              }

              @JavascriptInterface
              public void printNota() {
                  runOnUiThread(() -> {
                      PrintManager manager =
                          (PrintManager) getSystemService(Context.PRINT_SERVICE);

                      if (manager != null) {
                          PrintDocumentAdapter adapter =
                              web.createPrintDocumentAdapter("Nota-Side-Stand");

                          manager.print(
                              "Nota Side Stand Studio",
                              adapter,
                              new android.print.PrintAttributes.Builder()
                                  .setMediaSize(
                                      android.print.PrintAttributes.MediaSize.ISO_A4
                                  )
                                  .setColorMode(
                                      android.print.PrintAttributes.COLOR_MODE_COLOR
                                  )
                                  .build()
                          );
                      }
                  });
              }

              private String html() {
                  return """
          <!DOCTYPE html>
          <html lang="id">
          <head>
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <meta charset="UTF-8">
          <style>
          *{box-sizing:border-box}
          body{margin:0;background:#101010;color:#fff;font-family:Arial,sans-serif;padding:18px}
          .brand{text-align:center;font-size:12px;letter-spacing:5px;color:#aaa;margin:15px 0}
          h1{text-align:center;font-size:25px;margin:8px 0}
          .sub{text-align:center;color:#aaa;font-size:11px;margin-bottom:22px}
          .tabs{display:flex;gap:10px;margin-bottom:15px}
          .tab{flex:1;background:#242424;color:white;border:1px solid #444;border-radius:10px;padding:13px;font-weight:bold}
          .tab.active{background:white;color:#111}
          .box{background:#1c1c1c;border:1px solid #383838;border-radius:14px;padding:15px;margin-bottom:14px}
          label{display:block;font-size:13px;color:#ccc;margin:13px 0 7px}
          select,input{width:100%;padding:12px;border-radius:9px;border:1px solid #444;background:#111;color:white;font-size:15px}
          .check{display:flex;align-items:center;gap:10px;margin:14px 0;font-size:14px}
          .check input{width:19px;height:19px;accent-color:white}
          button.action{width:100%;border:0;border-radius:9px;padding:13px;margin-top:10px;font-weight:bold;font-size:14px}
          .white{background:white;color:#111}
          .dark{background:#333;color:white}
          .red{background:#552525;color:white}
          .note{font-size:11px;text-align:center;color:#999;margin:15px 0}
          .hidden{display:none!important}
          .cart-item{border:1px solid #414141;border-radius:10px;padding:12px;margin-top:10px;background:#151515}
          .cart-title{font-weight:bold;margin-bottom:5px}
          .cart-meta{font-size:12px;line-height:1.7;color:#ccc;overflow-wrap:anywhere}
          .cart-price{font-weight:bold;margin-top:8px}
          .cart-actions{display:flex;gap:8px}
          .cart-actions button{flex:1;border:0;border-radius:8px;padding:10px;margin-top:10px;font-weight:bold}
          .cart-actions .edit{background:#ddd;color:#111}
          .cart-actions .delete{background:#552525;color:#fff}
          .total{background:white;color:#111;padding:18px;border-radius:13px;text-align:center}
          .price{font-size:28px;font-weight:bold;margin:8px 0}
          .detail{font-size:13px;line-height:1.8;color:#ddd;margin-top:10px}
          .empty{font-size:13px;color:#999;text-align:center;padding:18px 5px}
          @media print{
           body{background:white;color:#111;padding:0}
           .brand,.sub{color:#333}
           .box{background:white;color:#111;border:1px solid #bbb}
           .tabs,.no-print,.note,.form-box{display:none!important}
           .cart-item{background:white;color:#111;border:1px solid #bbb;break-inside:avoid}
           .cart-meta{color:#222}
           .cart-actions{display:none!important}
           .total{border:1px solid #999;margin-top:12px}
           .detail{color:#111}
          }
          </style>
          </head>
          <body>
          <div class="brand">SIDE STAND STUDIO</div>
          <h1>PRICE CALCULATOR</h1>
          <div class="sub">CLOTHING ORDER ESTIMATOR</div>
          
          <div class="tabs no-print">
            <button class="tab active" id="tabOblong" onclick="setProduct('oblong')">OBLONG</button>
            <button class="tab" id="tabJersey" onclick="setProduct('jersey')">JERSEY</button>
          </div>
          
          <div class="box form-box">
            <b id="formHeading">Tambah produk ke keranjang</b>
            <label>Jenis bahan</label>
            <select id="fabric"></select>
          
            <label>Ukuran</label>
            <select id="size">
              <option value="0">S</option>
              <option value="0">M</option>
              <option value="0">L</option>
              <option value="0">XL</option>
              <option value="5000">XXL (+Rp5.000)</option>
              <option value="10000">XXXL (+Rp10.000)</option>
              <option value="15000">XXXXL (+Rp15.000)</option>
              <option value="20000">XXXXXL (+Rp20.000)</option>
            </select>
          
            <div id="oblongOptions">
              <div class="check"><input type="checkbox" id="long"><span>Lengan panjang (+Rp10.000)</span></div>
              <div class="check"><input type="checkbox" id="rib"><span>Tambah rib (+Rp5.000)</span></div>
            </div>
          
            <div id="jerseyOptions" class="hidden">
              <div class="check"><input type="checkbox" id="collar"><span>Tambah kerah (+Rp5.000)</span></div>
            </div>
          
            <label>Panjang gambar/sablon ke samping (cm)</label>
            <input id="printWidth" type="number" min="0" step="1" value="0">
            <div class="note">Biaya sablon Rp1.000 per cm ke samping.</div>
          
            <label>Jumlah untuk ukuran ini</label>
            <input id="qty" type="number" min="1" step="1" value="1">
          
            <button class="action white" id="addButton" onclick="addOrUpdateCart()">TAMBAHKAN KE KERANJANG</button>
            <button class="action dark hidden" id="cancelEditButton" onclick="cancelEdit()">BATAL EDIT</button>
          </div>
          
          <div class="box">
            <b>Keranjang pesanan</b>
            <div class="cart-meta">Masukkan tiap ukuran sebagai item terpisah. Contoh: M 3 pcs, L 2 pcs, XL 1 pcs.</div>
            <div id="cartList"><div class="empty">Keranjang masih kosong.</div></div>
          </div>
          
          <div class="total">
            <small>TOTAL SELURUH PESANAN</small>
            <div class="price" id="total">Rp0</div>
            <div id="itemCount">0 item · 0 pcs</div>
          </div>
          
          <div class="box" style="margin-top:14px">
            <b>Rincian nota</b>
            <div class="detail" id="details">Tambahkan produk ke keranjang untuk membuat nota.</div>
            <div class="no-print">
              <button class="action white" onclick="printNota()">CETAK NOTA / SIMPAN PDF</button>
              <button class="action dark" onclick="share()">BAGIKAN RINCIAN</button>
              <button class="action red" onclick="clearCart()">KOSONGKAN KERANJANG</button>
            </div>
          </div>
          <div class="note">SIDE STAND STUDIO · THANKS FOR YOUR SUPPORT</div>
          
          <script>
          let product = 'oblong';
          let cart = [];
          let editIndex = -1;
          
          const fabrics = {
            oblong: [
              {name:'Combed 30s', price:35000},
              {name:'Combed 24s', price:40000}
            ],
            jersey: [
              {name:'Milano', price:85000},
              {name:'Jarum', price:85000},
              {name:'Embos', price:90000},
              {name:'Puma', price:90000}
            ]
          };
          
          const rupiah = n => 'Rp' + Math.round(n).toLocaleString('id-ID');
          const el = id => document.getElementById(id);
