name: Build Side Stand Calculator APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Create Android project
        run: |
          mkdir -p app/src/main/java/com/sidestand/calculator

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "SideStandCalculator"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.sidestand.calculator'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.sidestand.calculator'
                  minSdk 23
                  targetSdk 28
                  versionCode 2
                  versionName '1.1'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:label="Side Stand Studio"
                  android:usesCleartextTraffic="false">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/sidestand/calculator/MainActivity.java <<'EOF'
          package com.sidestand.calculator;

          import android.app.Activity;
          import android.os.Bundle;
          import android.content.Context;
          import android.webkit.WebView;
          import android.webkit.WebSettings;
          import android.webkit.JavascriptInterface;
          import android.print.PrintManager;
          import android.print.PrintDocumentAdapter;
          import android.graphics.Color;

          public class MainActivity extends Activity {

              private WebView web;

              @Override
              public void onCreate(Bundle state) {
                  super.onCreate(state);

                  getWindow().setStatusBarColor(Color.rgb(12, 12, 12));
                  getWindow().setNavigationBarColor(Color.rgb(12, 12, 12));

                  web = new WebView(this);

                  WebSettings settings = web.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);

                  web.addJavascriptInterface(this, "Android");

                  setContentView(web);

                  web.loadDataWithBaseURL(
                      null,
                      html(),
                      "text/html",
                      "UTF-8",
                      null
                  );
              }

              @JavascriptInterface
              public void printNota() {
                  runOnUiThread(() -> {
                      PrintManager manager =
                          (PrintManager) getSystemService(Context.PRINT_SERVICE);

                      if (manager != null && web != null) {
                          PrintDocumentAdapter adapter =
                              web.createPrintDocumentAdapter("Nota-Side-Stand");

                          manager.print(
                              "Nota Side Stand Studio",
                              adapter,
                              new android.print.PrintAttributes.Builder()
                                  .setMediaSize(
                                      android.print.PrintAttributes.MediaSize.ISO_A4
                                  )
                                  .setColorMode(
                                      android.print.PrintAttributes.COLOR_MODE_COLOR
                                  )
                                  .build()
                          );
                      }
                  });
              }

              private String html() {
                  return """
          <!DOCTYPE html>
          <html lang="id">
          <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">

          <title>Side Stand Studio</title>

          <style>
          * {
              box-sizing: border-box;
          }

          body {
              margin: 0;
              padding: 18px;
              background: #101010;
              color: white;
              font-family: Arial, sans-serif;
          }

          .brand {
              text-align: center;
              font-size: 12px;
              letter-spacing: 5px;
              color: #aaa;
              margin: 15px 0;
          }

          h1 {
              text-align: center;
              font-size: 25px;
              margin: 8px 0;
          }

          .sub {
              text-align: center;
              color: #aaa;
              font-size: 11px;
              margin-bottom: 22px;
          }

          .tabs {
              display: flex;
              gap: 10px;
              margin-bottom: 15px;
          }

          .tab {
              flex: 1;
              padding: 13px;
              background: #242424;
              color: white;
              border: 1px solid #444;
              border-radius: 10px;
              font-weight: bold;
          }

          .tab.active {
              background: white;
              color: #111;
          }

          .box {
              background: #1c1c1c;
              border: 1px solid #383838;
              border-radius: 14px;
              padding: 15px;
              margin-bottom: 14px;
          }

          label {
              display: block;
              font-size: 13px;
              color: #ccc;
              margin: 13px 0 7px;
          }

          select,
          input:not([type=checkbox]) {
              width: 100%;
              padding: 12px;
              border-radius: 9px;
              border: 1px solid #444;
              background: #111;
              color: white;
              font-size: 15px;
          }

          .check {
              display: flex;
              align-items: center;
              gap: 10px;
              margin: 14px 0;
              font-size: 14px;
          }

          .check input {
              width: 19px;
              height: 19px;
              accent-color: white;
          }

          button.action {
              width: 100%;
              border: 0;
              border-radius: 9px;
              padding: 13px;
              margin-top: 10px;
              font-weight: bold;
              font-size: 14px;
          }

          .white {
              background: white;
              color: #111;
          }

          .dark {
              background: #333;
              color: white;
          }

          .red {
              background: #552525;
              color: white;
          }

          .hidden {
              display: none !important;
          }

          .note {
              font-size: 11px;
              text-align: center;
              color: #999;
              margin: 15px 0;
          }

          .cart-item {
              border: 1px solid #414141;
              border-radius: 10px;
              padding: 12px;
              margin-top: 10px;
              background: #151515;
          }

          .cart-title {
              font-weight: bold;
              margin-bottom: 5px;
          }

          .cart-meta {
              font-size: 12px;
              line-height: 1.8;
              color: #ccc;
              overflow-wrap: anywhere;
          }

          .cart-price {
              font-weight: bold;
              margin-top: 8px;
          }

          .cart-actions {
              display: flex;
              gap: 8px;
          }

          .cart-actions button {
              flex: 1;
              border: 0;
              border-radius: 8px;
              padding: 10px;
              margin-top: 10px;
              font-weight: bold;
          }

          .edit {
              background: #ddd;
              color: #111;
          }

          .delete {
              background: #552525;
              color: white;
          }

          .total {
              background: white;
              color: #111;
              padding: 18px;
              border-radius: 13px;
              text-align: center;
          }

          .price {
              font-size: 28px;
              font-weight: bold;
              margin: 8px 0;
          }

          .detail {
              font-size: 13px;
              line-height: 1.8;
              color: #ddd;
              margin-top: 10px;
              overflow-wrap: anywhere;
          }

          .empty {
              font-size: 13px;
              color: #999;
              text-align: center;
              padding: 18px 5px;
          }

          .print-only { display: none; }
          .invoice-head { text-align:center; padding: 10px 0 18px; border-bottom:2px solid #111; }
          .invoice-logo { display:block; width:100%; max-height:90px; object-fit:contain; margin:0 auto 10px; }
          .invoice-brand { font-size:25px; letter-spacing:8px; font-weight:800; }
          .invoice-tag { font-size:10px; letter-spacing:5px; margin-top:7px; }
          .invoice-title-row { display:flex; justify-content:space-between; gap:20px; margin:22px 0 18px; align-items:end; }
          .invoice-title { font-size:27px; font-weight:800; }
          .invoice-slogan { text-align:right; font-size:10px; letter-spacing:4px; line-height:1.8; }
          .invoice-meta { display:grid; grid-template-columns:1fr 1fr; gap:8px 24px; margin:16px 0 22px; font-size:12px; }
          .invoice-table { width:100%; border-collapse:collapse; font-size:11px; }
          .invoice-table th { background:#111; color:#fff; padding:10px 7px; text-align:left; }
          .invoice-table td { padding:12px 7px; border-bottom:1px solid #aaa; vertical-align:top; }
          .invoice-table .num, .invoice-table .money { text-align:right; white-space:nowrap; }
          .invoice-total-row { display:flex; justify-content:space-between; align-items:center; gap:15px; margin:20px 0; padding:16px 0; border-bottom:2px solid #111; }
          .invoice-total-label { font-size:12px; font-weight:bold; }
          .invoice-total-amount { font-size:30px; font-weight:900; }
          .invoice-bottom { display:grid; grid-template-columns:1fr 1fr; gap:20px; background:#f1f1f1; padding:16px; border-radius:8px; font-size:11px; }
          .invoice-bottom h3 { margin:0 0 10px; font-size:12px; }
          .invoice-footer { display:flex; justify-content:space-between; gap:10px; border-top:1px solid #111; padding-top:14px; margin-top:22px; font-size:10px; letter-spacing:2px; }
          @media print {
              @page { size: A4; margin: 14mm; }
              body {
                  background: white;
                  color: #111;
                  padding: 0;
              }

              .brand,
              .sub {
                  color: #333;
              }

              .tabs,
              .no-print,
              .note,
              .form-box,
              body > .brand,
              body > h1,
              body > .sub,
              body > .box,
              body > .total {
                  display: none !important;
              }
              .print-only { display: block !important; color:#111; background:#fff; }
              .invoice-table { page-break-inside:auto; }
              .invoice-table tr { page-break-inside:avoid; page-break-after:auto; }

              .box {
                  background: white;
                  color: #111;
                  border: 1px solid #bbb;
              }

              .cart-item {
                  background: white;
                  color: #111;
                  border: 1px solid #bbb;
                  break-inside: avoid;
              }

              .cart-meta {
                  color: #222;
              }

              .cart-actions {
                  display: none !important;
              }

              .total {
                  border: 1px solid #999;
                  margin-top: 12px;
              }

              .detail {
                  color: #111;
              }
          }
          </style>
          </head>

          <body>

          <div class="brand">SIDE STAND STUDIO</div>

          <h1>PRICE CALCULATOR</h1>

          <div class="sub">CLOTHING ORDER ESTIMATOR</div>

          <section class="print-only" id="printInvoice">
              <div class="invoice-head">
                  <div class="invoice-brand">SIDE STAND STUDIO</div>
                  <div class="invoice-tag">STREETWEAR &amp; CLOTHING</div>
              </div>
              <div class="invoice-title-row">
                  <div class="invoice-title">NOTA PESANAN</div>
                  <div class="invoice-slogan">BETTER CLOTHES<br>BETTER DAYS</div>
              </div>
              <div class="invoice-meta">
                  <div>No. Nota: <b id="invoiceNumber">#SSS-0001</b></div>
                  <div>Tanggal: <b id="invoiceDate">-</b></div>
                  <div>Nama: <b id="customerNamePrint">-</b></div>
                  <div>No. WhatsApp: <b id="customerPhonePrint">-</b></div>
              </div>
              <table class="invoice-table">
                  <thead><tr><th>No.</th><th>Produk</th><th>Bahan</th><th>Ukuran</th><th>Qty</th><th>Harga/pcs</th><th>Subtotal</th></tr></thead>
                  <tbody id="invoiceRows"></tbody>
              </table>
              <div class="invoice-total-row">
                  <div><div class="invoice-total-label">TOTAL ITEM</div><div id="invoiceItemCount">0 item · 0 pcs</div></div>
                  <div><div class="invoice-total-label">TOTAL PEMBAYARAN</div><div class="invoice-total-amount" id="invoiceTotal">Rp0</div></div>
              </div>
              <div class="invoice-bottom">
                  <div><h3>RINCIAN TAMBAHAN</h3><div id="invoiceExtras">Belum ada tambahan.</div></div>
                  <div><h3>CATATAN</h3>• Pastikan ukuran dan jumlah sudah sesuai sebelum proses produksi.<br>• Harga mengikuti bahan dan desain yang dipilih.<br>• Terima kasih telah mempercayai Side Stand Studio.</div>
              </div>
              <div class="invoice-footer"><span>@sidestandstudio</span><span>SIDE STAND STUDIO<br>THANKS FOR YOUR SUPPORT</span><span>LOCAL BRAND</span></div>
          </section>

          <div class="tabs no-print">
              <button class="tab active" id="tabOblong"
                  onclick="setProduct('oblong')">OBLONG</button>

              <button class="tab" id="tabJersey"
                  onclick="setProduct('jersey')">JERSEY</button>
          </div>

          <div class="box form-box">

              <b id="formHeading">Tambah produk ke keranjang</b>

              <label>Jenis bahan</label>
              <select id="fabric"></select>

              <label>Ukuran</label>

              <select id="size">
                  <option value="0">S</option>
                  <option value="0">M</option>
                  <option value="0">L</option>
                  <option value="0">XL</option>
                  <option value="5000">XXL (+Rp5.000)</option>
                  <option value="10000">XXXL (+Rp10.000)</option>
                  <option value="15000">XXXXL (+Rp15.000)</option>
                  <option value="20000">XXXXXL (+Rp20.000)</option>
              </select>

              <div id="oblongOptions">
                  <div class="check">
                      <input type="checkbox" id="long">
                      <span>Lengan panjang (+Rp10.000)</span>
                  </div>

                  <div class="check">
                      <input type="checkbox" id="rib">
                      <span>Tambah rib (+Rp5.000)</span>
                  </div>
              </div>

              <div id="jerseyOptions" class="hidden">
                  <div class="check">
                      <input type="checkbox" id="collar">
                      <span>Tambah kerah (+Rp5.000)</span>
                  </div>
              </div>

              <label>Panjang sablon ke samping (cm)</label>
              <input id="printWidth" type="number" min="0" step="1" value="0">

              <div class="note">
                  Biaya sablon Rp1.000 per cm ke samping.
              </div>

              <label>Jumlah untuk ukuran ini</label>
              <input id="qty" type="number" min="1" step="1" value="1">

              <button class="action white" id="addButton"
                  onclick="addOrUpdateCart()">
                  TAMBAHKAN KE KERANJANG
              </button>

              <button class="action dark hidden" id="cancelEditButton"
                  onclick="cancelEdit()">
                  BATAL EDIT
              </button>
          </div>

          <div class="box">
              <b>Keranjang pesanan</b>

              <div class="cart-meta">
                  Masukkan tiap ukuran sebagai item terpisah.
                  Contoh: M 3 pcs, L 2 pcs, XL 1 pcs.
              </div>

              <div id="cartList">
                  <div class="empty">Keranjang masih kosong.</div>
              </div>
          </div>

          <div class="total">
              <small>TOTAL SELURUH PESANAN</small>
              <div class="price" id="total">Rp0</div>
              <div id="itemCount">0 item · 0 pcs</div>
          </div>

          <div class="box" style="margin-top:14px">
              <b>Rincian nota</b>
              <label>Nama pelanggan (opsional)</label>
              <input id="customerName" type="text" placeholder="Nama pelanggan">
              <label>Nomor WhatsApp (opsional)</label>
              <input id="customerPhone" type="tel" placeholder="08xxxxxxxxxx">

              <div class="detail" id="details">
                  Tambahkan produk ke keranjang untuk membuat nota.
              </div>

              <div class="no-print">
                  <button class="action white" onclick="printNota()">
                      CETAK NOTA / SIMPAN PDF
                  </button>

                  <button class="action dark" onclick="share()">
                      BAGIKAN RINCIAN
                  </button>

                  <button class="action red"
