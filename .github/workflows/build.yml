name: Build Side Stand Calculator APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          
      - name: Create Android project
        run: |
          mkdir -p app/src/main/java/com/sidestand/calculator

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "SideStandCalculator"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.sidestand.calculator'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.sidestand.calculator'
                  minSdk 23
                  targetSdk 28
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:label="Side Stand Calculator"
                  android:usesCleartextTraffic="false">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

                    cat > app/src/main/java/com/sidestand/calculator/MainActivity.java <<'EOF'
          package com.sidestand.calculator;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebSettings;

          public class MainActivity extends Activity {
              @Override
              public void onCreate(Bundle state) {
                  super.onCreate(state);
                  WebView web = new WebView(this);
                  WebSettings settings = web.getSettings();
                  settings.setJavaScriptEnabled(true);
                  setContentView(web);
                  web.loadDataWithBaseURL(null, html(), "text/html", "UTF-8", null);
              }

              private String html() {
                  StringBuilder s = new StringBuilder();
                  s.append("<!DOCTYPE html><html lang='id'><head>");
                  s.append("<meta name='viewport' content='width=device-width,initial-scale=1'>");
                  s.append("<style>");
                  s.append("*{box-sizing:border-box}");
                  s.append("body{margin:0;background:#101010;color:white;font-family:Arial,sans-serif;padding:22px}");
                  s.append(".logo{text-align:center;font-size:13px;letter-spacing:5px;color:#aaa;margin-top:14px}");
                  s.append("h1{text-align:center;font-size:27px;margin:12px 0 5px}");
                  s.append(".sub{text-align:center;color:#aaa;margin-bottom:26px;font-size:12px}");
                  s.append(".box{background:#1c1c1c;border:1px solid #383838;border-radius:15px;padding:17px;margin-bottom:15px}");
                  s.append("label{display:block;font-size:13px;color:#ccc;margin:12px 0 7px}");
                  s.append("select,input{width:100%;padding:13px;border-radius:9px;border:1px solid #444;background:#111;color:white;font-size:15px}");
                  s.append(".check{display:flex;gap:10px;align-items:center;margin:15px 0;color:#eee}");
                  s.append(".check input{width:19px;height:19px}");
                  s.append(".total{background:white;color:#111;border-radius:13px;padding:20px;text-align:center}");
                  s.append(".price{font-size:29px;font-weight:bold;margin:8px 0}");
                  s.append(".detail{font-size:13px;line-height:1.9;color:#ddd}");
                  s.append("button{width:100%;border:0;padding:14px;border-radius:9px;font-size:15px;font-weight:bold;margin-top:12px}");
                  s.append(".black{background:#333;color:white}.white{background:white;color:#111}");
                  s.append(".note{font-size:11px;color:#999;text-align:center;margin:18px 0}");
                  s.append("</style></head><body>");
                  s.append("<div class='logo'>SIDE STAND STUDIO</div>");
                  s.append("<h1>PRICE CALCULATOR</h1>");
                  s.append("<div class='sub'>CLOTHING ORDER ESTIMATOR</div>");
                  s.append("<div class='box'>");
                  s.append("<label>Jenis bahan</label>");
                  s.append("<select id='fabric'><option value='35000'>Combed 30s - Rp35.000</option><option value='40000'>Combed 24s - Rp40.000</option></select>");
                  s.append("<label>Ukuran kaos</label>");
                  s.append("<select id='size'><option value='0'>S</option><option value='0'>M</option><option value='0'>L</option><option value='0'>XL</option><option value='5000'>XXL (+Rp5.000)</option><option value='10000'>XXXL (+Rp10.000)</option><option value='15000'>XXXXL (+Rp15.000)</option></select>");
                  s.append("<div class='check'><input type='checkbox' id='long'><span>Lengan panjang (+Rp10.000)</span></div>");
                  s.append("<div class='check'><input type='checkbox' id='rib'><span>Tambah rib (+Rp5.000)</span></div>");
                  s.append("<label>Panjang sablon ke samping (cm)</label>");
                  s.append("<input id='print' type='number' min='0' step='1' value='0'>");
                  s.append("<div class='note'>Biaya sablon Rp1.000 per cm ke samping.</div>");
                  s.append("<label>Jumlah kaos</label><input id='qty' type='number' min='1' step='1' value='1'></div>");
                  s.append("<div class='total'><small>TOTAL PESANAN</small><div class='price' id='total'>Rp35.000</div><div id='each'>Rp35.000 / kaos</div></div>");
                  s.append("<div class='box' style='margin-top:15px'><b>Rincian harga</b><div class='detail' id='details'></div>");
                  s.append("<button class='white' onclick='share()'>BAGIKAN RINCIAN</button><button class='black' onclick='resetForm()'>RESET KALKULATOR</button></div>");
                  s.append("<div class='note'>SIDE STAND STUDIO - THANKS FOR YOUR SUPPORT</div>");
                  s.append("<script>");
                  s.append("const rupiah=n=>'Rp'+Math.round(n).toLocaleString('id-ID');");
                  s.append("function calc(){let base=+document.getElementById('fabric').value;let sizeCost=+document.getElementById('size').value;let longCost=document.getElementById('long').checked?10000:0;let ribCost=document.getElementById('rib').checked?5000:0;let width=Math.max(0,Number(document.getElementById('print').value)||0);let qty=Math.max(1,Math.floor(Number(document.getElementById('qty').value)||1));let printCost=width*1000;let each=base+sizeCost+longCost+ribCost+printCost;document.getElementById('total').textContent=rupiah(each*qty);document.getElementById('each').textContent=rupiah(each)+' / kaos';document.getElementById('details').innerHTML='Bahan: '+rupiah(base)+'<br>Tambahan ukuran: '+rupiah(sizeCost)+'<br>Lengan panjang: '+rupiah(longCost)+'<br>Rib: '+rupiah(ribCost)+'<br>Sablon ('+width+' cm): '+rupiah(printCost)+'<br>Jumlah: '+qty+' kaos';}");
                  s.append("function share(){let txt='SIDE STAND STUDIO\\n'+document.getElementById('details').innerText+'\\nTotal: '+document.getElementById('total').innerText;if(navigator.share)navigator.share({title:'Rincian Pesanan',text:txt});else alert(txt);}");
                  s.append("function resetForm(){document.getElementById('fabric').value='35000';document.getElementById('size').value='0';document.getElementById('long').checked=false;document.getElementById('rib').checked=false;document.getElementById('print').value=0;document.getElementById('qty').value=1;calc();}");
                  s.append("document.querySelectorAll('select,input').forEach(el=>el.addEventListener('input',calc));calc();");
                  s.append("</script></body></html>");
                  return s.toString();
              }
          }
          EOF

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Side-Stand-Calculator-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
