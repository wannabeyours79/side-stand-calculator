name: Build Side Stand Calculator APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager --licenses
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Create Android project
        run: |
          mkdir -p app/src/main/java/com/sidestand/calculator

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "SideStandCalculator"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.sidestand.calculator'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.sidestand.calculator'
                  minSdk 23
                  targetSdk 28
                  versionCode 2
                  versionName '2.0'
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:label="Side Stand Studio"
                  android:usesCleartextTraffic="false">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/sidestand/calculator/MainActivity.java <<'EOF'
          package com.sidestand.calculator;

          import android.app.Activity;
          import android.os.Bundle;
          import android.content.Context;
          import android.webkit.WebView;
          import android.webkit.WebSettings;
          import android.webkit.JavascriptInterface;
          import android.print.PrintManager;
          import android.print.PrintDocumentAdapter;
          import android.content.Context;
          import android.graphics.Color;
          import android.view.ViewGroup;
          import android.view.Window;
          import android.view.WindowManager;

          public class MainActivity extends Activity {
              private WebView web;

              @Override
              public void onCreate(Bundle state) {
                  super.onCreate(state);

                  getWindow().setStatusBarColor(Color.rgb(12, 12, 12));
                  getWindow().setNavigationBarColor(Color.rgb(12, 12, 12));

                  web = new WebView(this);
                  WebSettings settings = web.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);

                  web.addJavascriptInterface(this, "Android");
                  setContentView(web);

                  web.loadDataWithBaseURL(
                      null, html(), "text/html", "UTF-8", null
                  );
              }

              @JavascriptInterface
              public void printNota() {
                  runOnUiThread(() -> {
                      PrintManager manager =
                          (PrintManager) getSystemService(Context.PRINT_SERVICE);

                      if (manager != null) {
                          PrintDocumentAdapter adapter =
                              web.createPrintDocumentAdapter("Nota-Side-Stand");

                          manager.print(
                              "Nota Side Stand Studio",
                              adapter,
                              new android.print.PrintAttributes.Builder()
                                  .setMediaSize(
                                      android.print.PrintAttributes.MediaSize.ISO_A4
                                  )
                                  .setColorMode(
                                      android.print.PrintAttributes.COLOR_MODE_COLOR
                                  )
                                  .build()
                          );
                      }
                  });
              }

              private String html() {
                  return """
          <!DOCTYPE html>
          <html lang="id">
          <head>
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <meta charset="UTF-8">
          <style>
          *{box-sizing:border-box}
          body{margin:0;background:#101010;color:#fff;font-family:Arial,sans-serif;padding:20px}
          .brand{text-align:center;font-size:12px;letter-spacing:5px;color:#aaa;margin:15px 0}
          h1{text-align:center;font-size:26px;margin:8px 0}
          .sub{text-align:center;color:#aaa;font-size:11px;margin-bottom:24px}
          .tabs{display:flex;gap:10px;margin-bottom:15px}
          .tab{flex:1;background:#242424;color:white;border:1px solid #444;border-radius:10px;padding:13px;font-weight:bold}
          .tab.active{background:white;color:#111}
          .box{background:#1c1c1c;border:1px solid #383838;border-radius:14px;padding:16px;margin-bottom:14px}
          label{display:block;font-size:13px;color:#ccc;margin:13px 0 7px}
          select,input{width:100%;padding:13px;border-radius:9px;border:1px solid #444;background:#111;color:white;font-size:15px}
          .check{display:flex;align-items:center;gap:10px;margin:15px 0;font-size:14px}
          .check input{width:19px;height:19px;accent-color:white}
          .total{background:white;color:#111;padding:20px;border-radius:13px;text-align:center}
          .price{font-size:30px;font-weight:bold;margin:8px 0}
          .detail{font-size:13px;line-height:1.9;color:#ddd;margin-top:10px}
          button.action{width:100%;border:0;border-radius:9px;padding:14px;margin-top:12px;font-weight:bold;font-size:14px}
          .white{background:white;color:#111}
          .dark{background:#333;color:white}
          .note{font-size:11px;text-align:center;color:#999;margin:17px 0}
          .hidden{display:none}
          @media print{
            body{background:white;color:#111;padding:0}
            .brand,.sub{color:#333}
            .box{background:white;color:#111;border:1px solid #bbb}
            label,.detail{color:#222}
            select,input{background:white;color:#111;border:0;padding:3px}
            .tabs,.no-print,.note{display:none!important}
            .total{border:1px solid #999}
            .price{font-size:24px}
            #details{color:#111}
          }
          </style>
          </head>
          <body>
          <div class="brand">SIDE STAND STUDIO</div>
          <h1>PRICE CALCULATOR</h1>
          <div class="sub">CLOTHING ORDER ESTIMATOR</div>

          <div class="tabs no-print">
            <button class="tab active" id="tabOblong" onclick="setProduct('oblong')">OBLONG</button>
            <button class="tab" id="tabJersey" onclick="setProduct('jersey')">JERSEY</button>
          </div>

          <div class="box">
            <label>Jenis bahan</label>
            <select id="fabric"></select>

            <label>Ukuran</label>
            <select id="size">
              <option value="0">S</option>
              <option value="0">M</option>
              <option value="0">L</option>
              <option value="0">XL</option>
              <option value="5000">XXL (+Rp5.000)</option>
              <option value="10000">XXXL (+Rp10.000)</option>
              <option value="15000">XXXXL (+Rp15.000)</option>
              <option value="20000">XXXXXL (+Rp20.000)</option>
            </select>

            <div id="oblongOptions">
              <div class="check">
                <input type="checkbox" id="long">
                <span>Lengan panjang (+Rp10.000)</span>
              </div>
              <div class="check">
                <input type="checkbox" id="rib">
                <span>Tambah rib (+Rp5.000)</span>
              </div>
            </div>

            <div id="jerseyOptions" class="hidden">
              <div class="check">
                <input type="checkbox" id="collar">
                <span>Tambah kerah (+Rp5.000)</span>
              </div>
            </div>

            <label>Panjang gambar/sablon ke samping (cm)</label>
            <input id="printWidth" type="number" min="0" step="1" value="0">
            <div class="note">Sablon Rp1.000 per cm ke samping.</div>

            <label>Jumlah pesanan</label>
            <input id="qty" type="number" min="1" step="1" value="1">
          </div>

          <div class="total">
            <small>TOTAL PESANAN</small>
            <div class="price" id="total">Rp35.000</div>
            <div id="each">Rp35.000 / pcs</div>
          </div>

          <div class="box" style="margin-top:15px">
            <b>Rincian harga</b>
            <div class="detail" id="details"></div>
            <div class="no-print">
              <button class="action white" onclick="printNota()">CETAK NOTA / SIMPAN PDF</button>
              <button class="action dark" onclick="share()">BAGIKAN RINCIAN</button>
              <button class="action dark" onclick="resetForm()">RESET KALKULATOR</button>
            </div>
          </div>

          <div class="note">SIDE STAND STUDIO · THANKS FOR YOUR SUPPORT</div>

          <script>
          let product = 'oblong';

          const fabrics = {
            oblong: [
              {name:'Combed 30s', price:35000},
              {name:'Combed 24s', price:40000}
            ],
            jersey: [
              {name:'Milano', price:85000},
              {name:'Jarum', price:85000},
              {name:'Embos', price:90000},
              {name:'Puma', price:90000}
            ]
          };

          const rupiah = n =>
            'Rp' + Math.round(n).toLocaleString('id-ID');

          function setProduct(p) {
            product = p;

            document.getElementById('tabOblong').classList.toggle(
              'active', p === 'oblong'
            );
            document.getElementById('tabJersey').classList.toggle(
              'active', p === 'jersey'
            );

            document.getElementById('oblongOptions').classList.toggle(
              'hidden', p !== 'oblong'
            );
            document.getElementById('jerseyOptions').classList.toggle(
              'hidden', p !== 'jersey'
            );

            const fabric = document.getElementById('fabric');
            fabric.innerHTML = '';

            fabrics[p].forEach(f => {
              const option = document.createElement('option');
              option.value = f.price;
              option.textContent = f.name + ' - ' + rupiah(f.price);
              fabric.appendChild(option);
            });

            calc();
          }

          function calc() {
            const base = Number(document.getElementById('fabric').value) || 0;
            const sizeCost = Number(document.getElementById('size').value) || 0;

            const longCost =
              product === 'oblong' &&
              document.getElementById('long').checked ? 10000 : 0;

            const ribCost =
              product === 'oblong' &&
              document.getElementById('rib').checked ? 5000 : 0;

            const collarCost =
              product === 'jersey' &&
              document.getElementById('collar').checked ? 5000 : 0;

            const width = Math.max(
              0,
              Number(document.getElementById('printWidth').value) || 0
            );

            const qty = Math.max(
              1,
              Math.floor(Number(document.getElementById('qty').value) || 1)
            );

            const printCost = width * 1000;
            const each = base + sizeCost + longCost +
                         ribCost + collarCost + printCost;

            document.getElementById('total').textContent =
              rupiah(each * qty);

            document.getElementById('each').textContent =
              rupiah(each) + ' / pcs';

            const fabricName =
              document.getElementById('fabric').selectedOptions[0]?.textContent || '-';

            const sizeName =
              document.getElementById('size').selectedOptions[0]?.textContent || '-';

            const lines = [
              'Produk: ' + product.toUpperCase(),
              'Bahan: ' + fabricName,
              'Ukuran: ' + sizeName,
              'Lengan panjang: ' + rupiah(longCost),
              'Rib: ' + rupiah(ribCost),
              'Kerah: ' + rupiah(collarCost),
              'Sablon (' + width + ' cm): ' + rupiah(printCost),
              'Harga per pcs: ' + rupiah(each),
              'Jumlah: ' + qty + ' pcs',
              'TOTAL: ' + rupiah(each * qty)
            ];

            document.getElementById('details').innerHTML =
              lines.map(line =>
                line.replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
              ).join('<br>');
          }

          function printNota() {
            if (window.Android && window.Android.printNota) {
              window.Android.printNota();
            } else {
              window.print();
            }
          }

          function share() {
            const text =
              'SIDE STAND STUDIO\\n' +
              document.getElementById('details').innerText;

            if (navigator.share) {
              navigator.share({
                title: 'Nota Side Stand Studio',
                text: text
              }).catch(() => {});
            } else if (navigator.clipboard) {
              navigator.clipboard.writeText(text)
                .then(() => alert('Rincian berhasil disalin.'));
            } else {
              alert(text);
            }
          }

          function resetForm() {
            document.getElementById('size').value = '0';
            document.getElementById('long').checked = false;
            document.getElementById('rib').checked = false;
            document.getElementById('collar').checked = false;
            document.getElementById('printWidth').value = '0';
            document.getElementById('qty').value = '1';
            setProduct('oblong');
          }

          document.querySelectorAll('select,input').forEach(el => {
            el.addEventListener('input', calc);
            el.addEventListener('change', calc);
          });

          setProduct('oblong');
          </script>
          </body>
          </html>
          """;
              }
          }
          EOF

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Side-Stand-Calculator-APK-v2
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
