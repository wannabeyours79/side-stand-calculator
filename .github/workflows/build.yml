          const fabrics = {
              oblong: [
                  { name: 'Combed 30s', price: 35000 },
                  { name: 'Combed 24s', price: 40000 }
              ],

              jersey: [
                  { name: 'Milano', price: 85000 },
                  { name: 'Jarum', price: 85000 },
                  { name: 'Embos', price: 90000 },
                  { name: 'Puma', price: 90000 }
              ]
          };

          const rupiah = n =>
              'Rp' + Math.round(n).toLocaleString('id-ID');

          const el = id => document.getElementById(id);

          function setProduct(p) {
              product = p;

              el('tabOblong').classList.toggle('active', p === 'oblong');
              el('tabJersey').classList.toggle('active', p === 'jersey');

              el('oblongOptions').classList.toggle('hidden', p !== 'oblong');
              el('jerseyOptions').classList.toggle('hidden', p !== 'jersey');

              const fabric = el('fabric');
              fabric.innerHTML = '';

              fabrics[p].forEach(f => {
                  const option = document.createElement('option');

                  option.value = f.price;
                  option.textContent = f.name + ' - ' + rupiah(f.price);
                  option.dataset.name = f.name;

                  fabric.appendChild(option);
              });

              if (p === 'oblong') {
                  el('collar').checked = false;
              } else {
                  el('long').checked = false;
                  el('rib').checked = false;
              }
          }

          function getFormItem() {
              const fabricOption = el('fabric').selectedOptions[0];
              const sizeOption = el('size').selectedOptions[0];

              const base = Number(el('fabric').value) || 0;
              const sizeCost = Number(el('size').value) || 0;

              const longCost =
                  product === 'oblong' && el('long').checked ? 10000 : 0;

              const ribCost =
                  product === 'oblong' && el('rib').checked ? 5000 : 0;

              const collarCost =
                  product === 'jersey' && el('collar').checked ? 5000 : 0;

              const width = Math.max(
                  0,
                  Math.floor(Number(el('printWidth').value) || 0)
              );

              const qty = Math.max(
                  1,
                  Math.floor(Number(el('qty').value) || 1)
              );

              const printCost = width * 1000;

              const each =
                  base + sizeCost + longCost + ribCost +
                  collarCost + printCost;

              return {
                  product: product,
                  fabricName: fabricOption
                      ? fabricOption.dataset.name
                      : '-',
                  base: base,
                  sizeName: sizeOption
                      ? sizeOption.textContent
                      : '-',
                  sizeCost: sizeCost,
                  longCost: longCost,
                  ribCost: ribCost,
                  collarCost: collarCost,
                  width: width,
                  printCost: printCost,
                  qty: qty,
                  each: each,
                  subtotal: each * qty
              };
          }

          function addOrUpdateCart() {
              const item = getFormItem();

              if (editIndex >= 0) {
                  cart[editIndex] = item;
                  editIndex = -1;

                  el('formHeading').textContent =
                      'Tambah produk ke keranjang';

                  el('addButton').textContent =
                      'TAMBAHKAN KE KERANJANG';

                  el('cancelEditButton').classList.add('hidden');
              } else {
                  cart.push(item);
              }

              renderCart();
              resetForm();
          }

          function editCartItem(index) {
              const item = cart[index];

              if (!item) return;

              editIndex = index;

              setProduct(item.product);

              el('fabric').value = String(item.base);
              el('size').value = String(item.sizeCost);
              el('long').checked = item.longCost > 0;
              el('rib').checked = item.ribCost > 0;
              el('collar').checked = item.collarCost > 0;
              el('printWidth').value = String(item.width);
              el('qty').value = String(item.qty);

              el('formHeading').textContent = 'Edit item keranjang';
              el('addButton').textContent = 'SIMPAN PERUBAHAN';
              el('cancelEditButton').classList.remove('hidden');

              window.scrollTo({ top: 0, behavior: 'smooth' });
          }

          function deleteCartItem(index) {
              if (index < 0 || index >= cart.length) return;

              cart.splice(index, 1);

              if (editIndex === index) {
                  cancelEdit();
              } else {
                  if (editIndex > index) editIndex--;

                  renderCart();
              }
          }

          function cancelEdit() {
              editIndex = -1;

              el('formHeading').textContent =
                  'Tambah produk ke keranjang';

              el('addButton').textContent =
                  'TAMBAHKAN KE KERANJANG';

              el('cancelEditButton').classList.add('hidden');

              resetForm();
          }

          function resetForm() {
              el('size').value = '0';
              el('long').checked = false;
              el('rib').checked = false;
              el('collar').checked = false;
              el('printWidth').value = '0';
              el('qty').value = '1';
          }

          function escapeHtml(value) {
              return String(value).replace(/[&<>"']/g, function(ch) {
                  return {
                      '&': '&amp;',
                      '<': '&lt;',
                      '>': '&gt;',
                      '"': '&quot;',
                      "'": '&#39;'
                  }[ch];
              });
          }

          function renderCart() {
              const list = el('cartList');

              if (cart.length === 0) {
                  list.innerHTML =
                      '<div class="empty">Keranjang masih kosong.</div>';
              } else {
                  list.innerHTML = cart.map((item, i) => {
                      const options = [];

                      if (item.longCost) options.push('Lengan panjang');
                      if (item.ribCost) options.push('Rib');
                      if (item.collarCost) options.push('Kerah');

                      if (item.width > 0) {
                          options.push('Sablon ' + item.width + ' cm');
                      }

                      const extras = options.length
                          ? options.join(', ')
                          : 'Tidak ada';

                      return '<div class="cart-item">' +
                          '<div class="cart-title">' +
                          (i + 1) + '. ' +
                          escapeHtml(item.product.toUpperCase()) +
                          ' · Ukuran ' +
                          escapeHtml(item.sizeName.split(' ')[0]) +
                          '</div>' +

                          '<div class="cart-meta">' +
                          'Bahan: ' + escapeHtml(item.fabricName) +
                          '<br>Jumlah: ' + item.qty + ' pcs' +
                          '<br>Tambahan: ' + escapeHtml(extras) +
                          '<br>Harga per pcs: ' + rupiah(item.each) +
                          '</div>' +

                          '<div class="cart-price">' +
                          'Subtotal: ' + rupiah(item.subtotal) +
                          '</div>' +

                          '<div class="cart-actions no-print">' +
                          '<button class="edit" onclick="editCartItem(' +
                          i + ')">EDIT</button>' +

                          '<button class="delete" onclick="deleteCartItem(' +
                          i + ')">HAPUS</button>' +
                          '</div></div>';
                  }).join('');
              }

              const total = cart.reduce(
                  (sum, item) => sum + item.subtotal,
                  0
              );

              const pcs = cart.reduce(
                  (sum, item) => sum + item.qty,
                  0
              );

              el('total').textContent = rupiah(total);

              el('itemCount').textContent =
                  cart.length + ' item · ' + pcs + ' pcs';

              if (cart.length === 0) {
                  el('details').textContent =
                      'Tambahkan produk ke keranjang untuk membuat nota.';

                  return;
              }

              const lines = [
                  'NOTA SIDE STAND STUDIO',
                  '================================',
                  ''
              ];

              cart.forEach((item, i) => {
                  lines.push(
                      (i + 1) + '. ' +
                      item.product.toUpperCase() + ' / ' +
                      item.fabricName
                  );

                  lines.push(
                      'Ukuran: ' + item.sizeName +
                      ' | Jumlah: ' + item.qty + ' pcs'
                  );

                  lines.push('Harga bahan: ' + rupiah(item.base));
                  lines.push('Tambahan ukuran: ' + rupiah(item.sizeCost));

                  if (item.longCost) {
                      lines.push(
                          'Lengan panjang: ' + rupiah(item.longCost)
                      );
                  }

                  if (item.ribCost) {
                      lines.push('Rib: ' + rupiah(item.ribCost));
                  }

                  if (item.collarCost) {
                      lines.push('Kerah: ' + rupiah(item.collarCost));
                  }

                  if (item.width > 0) {
                      lines.push(
                          'Sablon ' + item.width + ' cm: ' +
                          rupiah(item.printCost)
                      );
                  }

                  lines.push('Harga/pcs: ' + rupiah(item.each));
                  lines.push('Subtotal: ' + rupiah(item.subtotal));
                  lines.push('');
              });

              lines.push('================================');
              lines.push('Jumlah item: ' + cart.length);
              lines.push('Jumlah pcs: ' + pcs);
              lines.push('TOTAL: ' + rupiah(total));

              el('details').innerHTML = lines
                  .map(line => escapeHtml(line))
                  .join('<br>');
          }

          function printNota() {
              if (cart.length === 0) {
                  alert('Keranjang masih kosong!');
                  return;
              }

              if (window.Android && window.Android.printNota) {
                  window.Android.printNota();
              } else {
                  window.print();
              }
          }

          function share() {
              if (cart.length === 0) {
                  alert('Keranjang masih kosong!');
                  return;
              }

              const text =
                  el('details').innerText +
                  '\n\nTotal: ' + el('total').innerText;

              if (navigator.share) {
                  navigator.share({
                      title: 'Nota Side Stand Studio',
                      text: text
                  }).catch(function() {});
              } else if (navigator.clipboard) {
                  navigator.clipboard.writeText(text)
                      .then(() => alert('Rincian berhasil disalin!'))
                      .catch(() => alert(text));
              } else {
                  alert(text);
              }
          }

          function clearCart() {
              if (cart.length === 0) {
                  alert('Keranjang sudah kosong.');
                  return;
              }

              if (confirm(
                  'Yakin ingin mengosongkan seluruh keranjang?'
              )) {
                  cart = [];
                  editIndex = -1;

                  el('formHeading').textContent =
                      'Tambah produk ke keranjang';

                  el('addButton').textContent =
                      'TAMBAHKAN KE KERANJANG';

                  el('cancelEditButton').classList.add('hidden');

                  resetForm();
                  renderCart();
              }
          }

          document.querySelectorAll('select, input').forEach(elm => {
              elm.addEventListener('change', function() {});
          });

          setProduct('oblong');
          renderCart();

          </script>

          </body>
          </html>
          """;
              }
          }
          EOF

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Side-Stand-Calculator-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
