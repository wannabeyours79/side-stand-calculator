name: Build Side Stand Calculator APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Create Android project
        run: |
          mkdir -p app/src/main/java/com/sidestand/calculator app/src/main/res/drawable

          cat > app/src/main/res/drawable/ic_launcher.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#0C0C0C" android:pathData="M0,0h108v108h-108z" />
              <path android:fillColor="#FFFFFF" android:pathData="M24,25 C24,18 31,14 40,14 H66 C77,14 83,20 83,29 C83,36 78,40 69,44 L42,55 C31,59 25,64 25,74 C25,85 33,93 45,93 H67 C76,93 83,88 83,80 H69 C68,84 65,85 61,85 H46 C41,85 38,82 38,76 C38,71 42,68 49,65 L76,54 C86,50 91,43 91,31 C91,16 80,7 65,7 H40 C24,7 12,15 12,30 C12,35 13,39 16,43 L28,37 C25,34 24,30 24,25 Z" />
          </vector>
          EOF

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "SideStandCalculator"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.sidestand.calculator'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.sidestand.calculator'
                  minSdk 23
                  targetSdk 28
                  versionCode 4
                  versionName '1.3'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:label="Side Stand Studio"
                  android:icon="@drawable/ic_launcher"
                  android:usesCleartextTraffic="false">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/sidestand/calculator/MainActivity.java <<'EOF'
          package com.sidestand.calculator;

          import android.app.Activity;
          import android.os.Bundle;
          import android.content.Context;
          import android.content.Intent;
          import android.webkit.WebView;
          import android.webkit.WebSettings;
          import android.webkit.JavascriptInterface;
          import android.print.PrintManager;
          import android.print.PrintDocumentAdapter;
          import android.graphics.Color;

          public class MainActivity extends Activity {

              private WebView web;
              private boolean printPending = false;

              @Override
              public void onCreate(Bundle state) {
                  super.onCreate(state);

                  getWindow().setStatusBarColor(Color.rgb(12, 12, 12));
                  getWindow().setNavigationBarColor(Color.rgb(12, 12, 12));

                  web = new WebView(this);

                  WebSettings settings = web.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);

                  web.addJavascriptInterface(this, "Android");

                  setContentView(web);

                  web.loadDataWithBaseURL(
                      "https://appassets.androidplatform.net/",
                      html(),
                      "text/html",
                      "UTF-8",
                      null
                  );
              }
          }

          body {
              margin: 0;
              padding: 18px;
              background: #101010;
              color: white;
              font-family: Arial, sans-serif;
          }

          .brand {
              text-align: center;
              font-size: 12px;
              letter-spacing: 5px;
              color: #aaa;
              margin: 15px 0;
          }

          h1 {
              text-align: center;
              font-size: 25px;
              margin: 8px 0;
          }

          .sub {
              text-align: center;
              color: #aaa;
              font-size: 11px;
              margin-bottom: 22px;
          }

          .tabs {
              display: flex;
              gap: 10px;
              margin-bottom: 15px;
          }

          .tab {
              flex: 1;
              padding: 13px;
              background: #242424;
              color: white;
              border: 1px solid #444;
              border-radius: 10px;
              font-weight: bold;
          }

          .tab.active {
              background: white;
              color: #111;
          }

          .box {
              background: #1c1c1c;
              border: 1px solid #383838;
              border-radius: 14px;
              padding: 15px;
              margin-bottom: 14px;
          }

          label {
              display: block;
              font-size: 13px;
              color: #ccc;
              margin: 13px 0 7px;
          }

          select,
          input:not([type=checkbox]) {
              width: 100%;
              padding: 12px;
              border-radius: 9px;
              border: 1px solid #444;
              background: #111;
              color: white;
              font-size: 15px;
          }
          .cart-item {
              border: 1px solid #414141;
              border-radius: 10px;
              padding: 12px;
              margin-top: 10px;
              background: #151515;
          }

          .cart-title {
              font-weight: bold;
              margin-bottom: 5px;
          }

          .cart-meta {
              font-size: 12px;
              line-height: 1.8;
              color: #ccc;
              overflow-wrap: anywhere;
          }

          .cart-price {
              font-weight: bold;
              margin-top: 8px;
          }

          .cart-actions {
              display: flex;
              gap: 8px;
          }

          .cart-actions button {
              flex: 1;
              border: 0;
              border-radius: 8px;
              padding: 10px;
              margin-top: 10px;
              font-weight: bold;
          }

          .edit {
              background: #ddd;
              color: #111;
          }

          .delete {
              background: #552525;
              color: white;
          }

          .total {
              background: white;
              color: #111;
              padding: 18px;
              border-radius: 13px;
              text-align: center;
          }

          .price {
              font-size: 28px;
              font-weight: bold;
              margin: 8px 0;
          }

          .detail {
              font-size: 13px;
              line-height: 1.8;
              color: #ddd;
              margin-top: 10px;
              overflow-wrap: anywhere;
          }

          .empty {
              font-size: 13px;
              color: #999;
              text-align: center;
              padding: 18px 5px;
          }
          .invoice-footer { display:flex; justify-content:space-between; gap:10px; border-top:1px solid #111; padding-top:14px; margin-top:22px; font-size:10px; letter-spacing:2px; }
          @media print {
              @page { size: A4; margin: 14mm; }
              body {
                  background: white;
                  color: #111;
                  padding: 0;
              }

              .brand,
              .sub {
                  color: #333;
              }

              .tabs,
              .no-print,
              .note,
              .form-box,
              body > .brand,
              body > h1,
              body > .sub,
              body > .box,
              body > .total {
                  display: none !important;
              }
              .print-only { display: block !important; color:#111; background:#fff; }
              .invoice-table { page-break-inside:auto; }
              .invoice-table tr { page-break-inside:avoid; page-break-after:auto; }

              .box {
                  background: white;
                  color: #111;
                  border: 1px solid #bbb;
              }

              .cart-item {
                  background: white;
                  color: #111;
                  border: 1px solid #bbb;
                  break-inside: avoid;
              }

              .cart-meta {
                  color: #222;
              }

              .cart-actions {
                  display: none !important;
              }

              .total {
                  border: 1px solid #999;
                  margin-top: 12px;
              }

              .detail {
                  color: #111;
              }
          }
          </style>
          </head>

          <body>
              <div id="oblongOptions">
                  <div class="check">
                      <input type="checkbox" id="long">
                      <span>Lengan panjang (+Rp10.000)</span>
                  </div>

                  <div class="check">
                      <input type="checkbox" id="rib">
                      <span>Tambah rib (+Rp5.000)</span>
                  </div>
              </div>

              <div id="jerseyOptions" class="hidden">
                  <div class="check">
                      <input type="checkbox" id="collar">
                      <span>Tambah kerah (+Rp5.000)</span>
                  </div>
              </div>

              <label>Panjang sablon ke samping (cm)</label>
              <input id="printWidth" type="number" min="0" step="1" value="0">

              <div class="note">
                  Biaya sablon Rp1.000 per cm ke samping.
              </div>

              <label>Jumlah untuk ukuran ini</label>
              <input id="qty" type="number" min="1" step="1" value="1">

              <button class="action white" id="addButton"
                  onclick="addOrUpdateCart()">
                  TAMBAHKAN KE KERANJANG
              </button>

              <button class="action dark hidden" id="cancelEditButton"
                  onclick="cancelEdit()">
                  BATAL EDIT
              </button>
          </div>

          <div class="box">
              <b>Keranjang pesanan</b>

              <div class="cart-meta">
                  Masukkan tiap ukuran sebagai item terpisah.
                  Contoh: M 3 pcs, L 2 pcs, XL 1 pcs.
              </div>

              <div id="cartList">
                  <div class="empty">Keranjang masih kosong.</div>
              </div>
          </div>

        
          <div class="box">
              <b>Data pelanggan</b>
              <label>Nama pelanggan (opsional)</label>
              <input id="customerName" type="text" placeholder="Nama pelanggan">
              <label>Nomor WhatsApp (opsional)</label>
              <input id="customerPhone" type="tel" placeholder="08xxxxxxxxxx">
              <div class="detail" id="details">
                  Tambahkan produk ke keranjang untuk membuat nota.
              </div>
          </div>

          <div class="total">
              <div>TOTAL PESANAN</div>
              <div class="price" id="total">Rp0</div>
              <div id="itemCount">0 item · 0 pcs</div>
          </div>

          <div class="box no-print">
              <button class="action white" onclick="printNota()">CETAK NOTA / SIMPAN PDF</button>
              <button class="action dark" onclick="share()">BAGIKAN RINCIAN</button>
              <button class="action red" onclick="clearCart()">KOSONGKAN KERANJANG</button>
          </div>

          <div class="note">
              SIDE STAND STUDIO · THANKS FOR YOUR SUPPORT
          </div>

          <script>
          let product = 'oblong';
          let cart = [];
          let editIndex = -1;

          const fabrics = {
              oblong: [
                  {name: 'Combed 30s', price: 35000},
                  {name: 'Combed 24s', price: 40000}
              ],
              jersey: [
                  {name: 'Milano', price: 85000},
                  {name: 'Jarum', price: 85000},
                  {name: 'Embos', price: 90000},
                  {name: 'Puma', price: 90000}
              ]
          };
                  // Keep the calculator working if storage is unavailable.
              }
          }

          function currentInvoiceNumber() {
              return '#SSS-' + String(readNextInvoice()).padStart(4, '0');
          }

          function updateInvoiceNumber() {
              const node = el('invoiceNumber');
              if (node) node.textContent = currentInvoiceNumber();
          }

          function finishCurrentOrder() {
              if (cart.length === 0) return;
              if (!confirm('Sudah selesai mencetak atau menyimpan nota? Jika ya, keranjang dikosongkan dan nomor nota berikutnya dibuat.')) {
                  return;
              }
              const next = readNextInvoice();
              saveNextInvoice(next + 1);
              cart = [];
              editIndex = -1;
              el('customerName').value = '';
              el('customerPhone').value = '';
              el('customerNamePrint').textContent = '-';
              el('customerPhonePrint').textContent = '-';
              el('formHeading').textContent = 'Tambah produk ke keranjang';
              el('addButton').textContent = 'TAMBAHKAN KE KERANJANG';
              el('cancelEditButton').classList.add('hidden');
              resetForm();
              renderCart();
              updateInvoiceNumber();
              alert('Pesanan selesai. Nomor nota berikutnya: ' + currentInvoiceNumber());
          }

          window.onPrintDialogClosed = function() {
              if (cart.length > 0) finishCurrentOrder();
          };

          window.addEventListener('afterprint', function() {
              if (!(window.Android && window.Android.printNota) && cart.length > 0) {
                  finishCurrentOrder();
              }
          });

          function setProduct(p) {
              product = p;

              el('tabOblong').classList.toggle(
                  'active', p === 'oblong'
              );

              el('tabJersey').classList.toggle(
                  'active', p === 'jersey'
              );

              el('oblongOptions').classList.toggle(
                  'hidden', p !== 'oblong'
              );

              el('jerseyOptions').classList.toggle(
                  'hidden', p !== 'jersey'
              );

              const fabric = el('fabric');
              fabric.innerHTML = '';

              fabrics[p].forEach(f => {
                  const option = document.createElement('option');

                  option.value = f.price;
                  option.textContent = f.name + ' - ' + rupiah(f.price);
                  option.dataset.name = f.name;

                  fabric.appendChild(option);
              });

              renderCart();
          }

              setProduct(item.product);

              el('fabric').value = String(item.base);
              el('size').value = String(item.sizeCost);

              el('long').checked = item.longCost > 0;
              el('rib').checked = item.ribCost > 0;
              el('collar').checked = item.collarCost > 0;

              el('printWidth').value = String(item.width);
              el('qty').value = String(item.qty);

              el('formHeading').textContent = 'Edit item keranjang';
              el('addButton').textContent = 'SIMPAN PERUBAHAN';

              el('cancelEditButton').classList.remove('hidden');

              window.scrollTo({top: 0, behavior: 'smooth'});
          }

          function deleteCartItem(index) {
              cart.splice(index, 1);

              if (editIndex === index) {
                  cancelEdit();
              } else if (editIndex > index) {
                  editIndex--;
              }

              renderCart();
          }

          function cancelEdit() {
              editIndex = -1;

              el('formHeading').textContent =
                  'Tambah produk ke keranjang';

              el('addButton').textContent =
                  'TAMBAHKAN KE KERANJANG';

              el('cancelEditButton').classList.add('hidden');

              resetForm();
          }

          function resetForm() {
              el('size').value = '0';

              el('long').checked = false;
              el('rib').checked = false;
              el('collar').checked = false;

              el('printWidth').value = '0';
              el('qty').value = '1';
          }

          function renderCart() {
              const list = el('cartList');

              if (cart.length === 0) {
                  list.innerHTML =
                      '<div class="empty">Keranjang masih kosong.</div>';
              } else {
                  list.innerHTML = cart.map((item, i) => {
                      const options = [];

                      if (item.longCost) {
                          options.push('Lengan panjang');
                      }

                      if (item.ribCost) {
                          options.push('Rib');
                      }

                      if (item.collarCost) {
                          options.push('Kerah');
                      }

                      if (item.width > 0) {
                          options.push('Sablon ' + item.width + ' cm');
                      }

                      return `
                      <div class="cart-item">
                          <div class="cart-title">
                              ${i + 1}. ${escapeHtml(item.product.toUpperCase())}
                              · Ukuran ${escapeHtml(item.sizeName.split(' ')[0])}
                          </div>
                  if (item.ribCost) {
                      lines.push('   Rib: ' + rupiah(item.ribCost));
                  }

                  if (item.collarCost) {
                      lines.push('   Kerah: ' + rupiah(item.collarCost));
                  }

                  if (item.width > 0) {
                      lines.push(
                          '   Sablon ' + item.width + ' cm: ' +
                          rupiah(item.printCost)
                      );
                  }

                  lines.push('   Harga/pcs: ' + rupiah(item.each));
                  lines.push('   Subtotal: ' + rupiah(item.subtotal));
                  lines.push('');
              });

              lines.push('Jumlah item: ' + cart.length);
              lines.push('Jumlah pcs: ' + pcs);
              lines.push('TOTAL: ' + rupiah(total));

              el('details').innerHTML = lines
                  .map(line => escapeHtml(line))
                  .join('<br>');
          }

          function printNota() {
              if (cart.length === 0) {
                  alert('Keranjang masih kosong!');
                  return;
              }
              updateInvoiceNumber();
              if (window.Android && window.Android.printNota) {
                  window.Android.printNota();
              } else {
                  window.print();
              }
          }

          function share() {
              if (cart.length === 0) {
                  alert('Keranjang masih kosong!');
                  return;
              }
              const customer = el('customerName').value.trim();
              const phone = el('customerPhone').value.trim();
              const text = [
                  'SIDE STAND STUDIO',
                  'NOTA PESANAN ' + currentInvoiceNumber(),
                  'Tanggal: ' + new Date().toLocaleString('id-ID'),
                  customer ? 'Nama pelanggan: ' + customer : '',
                  phone ? 'WhatsApp: ' + phone : '',
                  '',
                  el('details').innerText,
                  '',
                  'TOTAL PEMBAYARAN: ' + el('total').innerText,
                  '',
                  'Terima kasih sudah mempercayai Side Stand Studio!'
              ].filter(Boolean).join('\n');
              if (window.Android && window.Android.shareText) {
                  window.Android.shareText(text);
              } else if (navigator.share) {
                  navigator.share({title: 'Nota Side Stand Studio', text: text}).catch(() => {});
              } else if (navigator.clipboard && navigator.clipboard.writeText) {
                  navigator.clipboard.writeText(text)
                      .then(() => alert('Nota disalin. Lu bisa tempel ke WhatsApp.'))
                      .catch(() => alert(text));
              } else {
                  alert(text);
              }
          }

          function clearCart() {
              if (cart.length === 0) {
                  alert('Keranjang sudah kosong.');
                  return;
              }
              if (!confirm('Yakin ingin menghapus semua isi keranjang?')) return;
              cart = [];
              editIndex = -1;
              el('customerName').value = '';
              el('customerPhone').value = '';
              el('customerNamePrint').textContent = '-';
              el('customerPhonePrint').textContent = '-';
              el('formHeading').textContent = 'Tambah produk ke keranjang';
              el('addButton').textContent = 'TAMBAHKAN KE KERANJANG';
              el('cancelEditButton').classList.add('hidden');
              resetForm();
              renderCart();
              alert('Keranjang berhasil dikosongkan. Nomor nota tidak berubah.');
          }

          el('customerName').addEventListener('input', () => {
              el('customerNamePrint').textContent = el('customerName').value.trim() || '-';
          });
          el('customerPhone').addEventListener('input', () => {
              el('customerPhonePrint').textContent = el('customerPhone').value.trim() || '-';
          });

          updateInvoiceNumber();
          setProduct('oblong');
          renderCart();
          </script>

          </body>
          </html>
          """;
              }
          }
          EOF

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Side-Stand-Calculator-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
